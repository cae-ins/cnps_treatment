[project]
name = "cnps-treatment"
version = "2.0.0"
description = "Pipeline de traitement statistique des declarations salariales CNPS - Cote d'Ivoire"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.2.0",
    "fastexcel>=0.11.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "minio>=7.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]
notebook = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
cnps = "cnps.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Les modules d'etape sont volontairement prefixes par leur ordre d'execution,
# la notation matricielle X/Q/M est standard dans les estimateurs, et le
# formateur ne coupe pas les longs messages de journalisation.
ignore = ['E501', 'N803', 'N806', 'N999']
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

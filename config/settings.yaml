# =============================================================================
# CNPS Treatment Pipeline - Configuration principale
# =============================================================================
# Ce fichier centralise tous les parametres du pipeline.
# Modifier les chemins et parametres ici sans toucher au code.
# =============================================================================

# --- Chemins du projet ---
# Toutes les donnees (brutes, intermediaires, modeles, exports, sessions)
# vivent sur MinIO : voir la section minio ci-dessous. Le seul chemin local
# necessaire est celui des logs d'execution.
paths:
  # Repertoire racine du projet source.
  # Laisser vide: resolu automatiquement vers la racine du depot par config.py
  project_root: ""
  # Logs d'execution
  logs: "${project_root}/logs"

# --- Parametres d'ingestion ---
ingestion:
  # Convention de nommage: MM_YYYY.xlsx
  filename_regex: "^(\\d{2})_(\\d{4})\\.xlsx$"
  # Feuilles a ignorer (regex)
  skip_sheets: []

# --- Parametres de nettoyage ---
cleaning:
  # Seuil minimum de salaire mensuel (FCFA)
  min_salary: 75000
  # Types d'employes a exclure (H=horaire, J=journalier)
  #
  # Horaires (H) EXCLUS -- decision fondee sur l'audit du 28/07/2026
  # (feuille Analyse_Salaire, 23 fichiers) : sur 157 054 lignes horaires,
  # 65,5% presentent une confusion d'unite suspectee et 69,0% une
  # DUREE_TRAVAILLEE incoherente. La majorite n'est pas interpretable ;
  # les convertir au mois propagerait ces erreurs amplifiees. Pour 1,4% de
  # l'effectif, le rapport benefice/risque est defavorable.
  #
  # Journaliers (J) CONSERVES : leur DUREE_TRAVAILLEE est saine (0,12%
  # d'incoherence) et la conversion x22,4 repose donc sur une base fiable.
  # Ils representent 5,7% des salaires a periodicite connue -- les exclure
  # biaiserait la representativite vers les seuls emplois stables.
  # (Les 45,7% de "confusions" detectees sur J sont vraisemblablement des
  # faux positifs de l'heuristique : un journalier bien paye ressemble a un
  # mensuel mal paye.)
  exclude_employee_types: ["H"]
  # Winsorisation: percentiles de troncature
  winsor_lower: 0.01
  winsor_upper: 0.99
  # Suppression des doublons
  remove_duplicates: true
  # Duree travaillee max (mois)
  max_duration: 12
  # Part maximale de valeurs numeriques non vides impossibles a parser.
  numeric_parse_failure_threshold: 0.01
  # Hypothese explicite pour TYPE_SALARIE non renseigne: monthly ou daily.
  unknown_periodicity_assumption: "monthly"

# --- Parametres de modelisation ---
modeling:
  # Parametre du prototype experimental 08, hors DAG de publication.
  n_imputations: 5
  # Graine aleatoire pour reproductibilite
  random_seed: 42
  # Trimming des poids IPW (percentiles)
  ipw_trim_lower: 0.01
  ipw_trim_upper: 0.99
  # Methode d'estimation implementee. AIPW et TMLE restent differes.
  estimation_method: "ipw"
  # Repere AUC descriptif (un score faible n'est jamais bloquant a lui seul)
  min_auc: 0.60
  # Pente de calibration acceptable
  calibration_slope_range: [0.8, 1.2]
  # Portee: au moins une declaration dans les K mois strictement precedents.
  # Utiliser "inf" pour conserver toutes les periodes depuis le debut a risque.
  risk_window_months: 12
  # Validation croisee groupee par employeur.
  n_cv_splits: 5
  # Diagnostics de positivite et de calibration.
  propensity_clip: 0.000001
  max_clipped_share: 0.01
  max_trimmed_share: 0.05
  max_calibration_in_large: 0.10
  max_abs_smd: 0.25
  min_structural_stratum_size: 30

# --- Parametres d'estimation ---
estimation:
  # Taille minimale de cellule pour publication
  min_cell_size: 30
  # Niveau de confiance pour les intervalles
  confidence_level: 0.95
  # Plage de salaire plausible (FCFA)
  salary_plausible_range: [75000, 50000000]
  # Secret statistique primaire.
  min_distinct_individuals: 30
  min_distinct_employers: 3
  max_employer_wage_share: 0.85
  # Aucun IC n'est diffuse tant que la linearisation conjointe p/q n'est pas validee.
  inference_method: "point_only"

# --- Stockage objet MinIO ---
# Toutes les donnees du pipeline (brutes, intermediaires, modeles, exports)
# vivent sur MinIO plutot que sur disque local : voir src/cnps/storage.py.
#
# Organisation en couches (medaillon) : chaque famille de donnees vit dans
# un bucket different sur le serveur MinIO. "datalab" (voir ~/.mc/config.json)
# est seulement l'alias mc local vers le serveur -- ce n'est PAS un bucket,
# il ne doit jamais apparaitre dans un chemin bucket/prefixe ci-dessous.
#
# Qui lit / qui ecrit chaque bucket+prefixe (etapes numerotees = src/cnps/NN_*.py) :
#   raw_bucket/raw_prefix         <- (source externe, deposee manuellement)
#                                  -> LU par 01_lecture_fichiers.py
#   processed_bucket/processed_prefix -> ECRIT par 01_lecture_fichiers.py (Excel -> Parquet)
#                                  -> RE-ECRIT (en place) par 02_harmonisation_types.py
#                                  -> LU par 03_nettoyage_donnees.py et audit.py
#   cleaned_bucket/cleaned_prefix  -> ECRIT par 03_nettoyage_donnees.py (cnps_cleaned.parquet)
#                                  -> ECRIT par 04_base_individus.py (individual_base.parquet)
#                                  -> ECRIT par 05_base_entreprises.py (firm_base.parquet)
#                                  -> ECRIT par 06_base_analytique.py (analytical_base.parquet)
#                                  -> RE-ECRIT (en place) par 07_modele_declaration.py (firm_base.parquet + poids IPW)
#                                  -> RE-ECRIT (en place) par 09_ponderation_finale.py (analytical_base.parquet + W_FINAL)
#                                  -> LU par 10_estimation_indicateurs.py et 11_validation_qualite.py
#   models_bucket/models_prefix    -> ECRIT par 07/07b (resumes JSON non executables)
#   Le prototype 08, hors publication, ecrit aussi un resume JSON s'il est lance seul.
#                                  -> LU par 11_validation_qualite.py
#   output_bucket/output_prefix    -> ECRIT par 12_export_excel.py (indicateurs_cnps.xlsx)
#                                  -> ECRIT par audit.py (audit_fichiers_cnps_*.xlsx)
#                                  -> ECRIT par pipeline.py (sessions/{id}/metadata.json)
#                                  -> LU par jointure_anstat.py (REQUETES_ANSTAT_MODULE_EMPLOYEURS.xlsx,
#                                     depose manuellement dans raw_bucket/raw_prefix racine)
#
# Voir le README (section "Le fil d'execution") pour le detail complet
# entrees/sorties de chaque etape.
minio:
  # Le mode production exige TLS et des secrets explicites.
  environment: "development"
  allow_insecure_minio: true
  # Adresse du serveur MinIO (reseau interne)
  endpoint: "192.168.1.230:30137"
  # Fichiers Excel bruts (MM_YYYY.xlsx).
  # ATTENTION: ce bucket contient aussi des fichiers sans rapport avec le
  # pipeline (CSV, autres sous-dossiers) : le code filtre toujours par
  # extension/motif de nom (MM_YYYY.xlsx), ne liste jamais ce prefixe sans filtre.
  raw_bucket: "staging"
  raw_prefix: "cnps/fichiers_mensuels/"
  # Parquets issus de l'ingestion (MM_YYYY.parquet) + registre de suivi
  processed_bucket: "silver"
  processed_prefix: "cnps/"
  # Donnees nettoyees et bases structurees (individus, entreprises, analytique)
  cleaned_bucket: "gold"
  cleaned_prefix: "cnps/"
  # Resumes de modeles et diagnostics sauvegardes en JSON non executable
  models_bucket: "models"
  models_prefix: "cnps/"
  # Exports Excel finaux (indicateurs, rapports, audits, sessions)
  output_bucket: "staging"
  output_prefix: "cnps/exports_gold/"
  # Connexion chiffree (HTTP permis uniquement en development avec opt-in explicite)
  secure: false

# --- Parallelisation ---
parallel:
  # Nombre de workers (-1 = tous les coeurs)
  n_jobs: -1
  # Backend joblib: "loky", "threading", "multiprocessing"
  backend: "loky"

# --- Logging ---
logging:
  # Niveau: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # Rotation des logs
  rotation: "10 MB"
  # Retention
  retention: "30 days"

# --- Publication Git des rapports de recette ---
# Double opt-in : cette autorisation doit etre vraie ET la variable
# CNPS_AUTO_GIT_PUSH doit valoir true/1/yes au moment du run.
git_publication:
  allowed: true
  remote: "origin"
  branch: "fix/audit-phase-b"
  reports_directory: "run_reports"
  # Les estimations peuvent etre sensibles et restent hors Git par defaut.
  include_estimates: false

# =============================================================================
# CNPS Treatment Pipeline - Configuration principale
# =============================================================================
# Ce fichier centralise tous les parametres du pipeline.
# Modifier les chemins et parametres ici sans toucher au code.
# =============================================================================

# --- Chemins du projet ---
# Toutes les donnees (brutes, intermediaires, modeles, exports, sessions)
# vivent sur MinIO : voir la section minio ci-dessous. Le seul chemin local
# necessaire est celui des logs d'execution.
paths:
  # Repertoire racine du projet source.
  # Laisser vide: resolu automatiquement vers la racine du depot par config.py
  project_root: ""
  # Logs d'execution
  logs: "${project_root}/logs"

# --- Parametres d'ingestion ---
ingestion:
  # Format des fichiers source
  file_pattern: "*.xlsx"
  # Convention de nommage: MM_YYYY.xlsx
  filename_regex: "^(\\d{2})_(\\d{4})\\.xlsx$"
  # Feuilles a ignorer (regex)
  skip_sheets: []
  # Encodage par defaut
  encoding: "utf-8"

# --- Parametres de nettoyage ---
cleaning:
  # Seuil minimum de salaire mensuel (FCFA)
  min_salary: 75000
  # Types d'employes a exclure (H=horaire, J=journalier)
  exclude_employee_types: ["H", "J"]
  # Winsorisation: percentiles de troncature
  winsor_lower: 0.01
  winsor_upper: 0.99
  # Suppression des doublons
  remove_duplicates: true
  # Duree travaillee max (mois)
  max_duration: 12

# --- Parametres de modelisation ---
modeling:
  # Nombre d'imputations multiples (Rubin, 1987)
  n_imputations: 5
  # Graine aleatoire pour reproductibilite
  random_seed: 42
  # Trimming des poids IPW (percentiles)
  ipw_trim_lower: 0.01
  ipw_trim_upper: 0.99
  # Methode d'estimation: "ipw", "aipw" (doublement robuste), "tmle"
  estimation_method: "aipw"
  # Seuil minimum AUC pour validation du modele
  min_auc: 0.60
  # Pente de calibration acceptable
  calibration_slope_range: [0.8, 1.2]

# --- Parametres d'estimation ---
estimation:
  # Taille minimale de cellule pour publication
  min_cell_size: 30
  # Niveau de confiance pour les intervalles
  confidence_level: 0.95
  # Plage de salaire plausible (FCFA)
  salary_plausible_range: [75000, 50000000]

# --- Stockage objet MinIO ---
# Toutes les donnees du pipeline (brutes, intermediaires, modeles, exports)
# vivent sur MinIO plutot que sur disque local : voir src/cnps/storage/.
minio:
  # Adresse du serveur MinIO (reseau interne)
  endpoint: "192.168.1.230:30137"
  # Bucket source des donnees CNPS
  bucket: "staging"
  # Prefixe dedie au pipeline, isole des autres donnees deja presentes dans le bucket
  # Fichiers Excel bruts (MM_YYYY.xlsx), directement a la racine de cnps/
  # ATTENTION: ce prefixe contient aussi des CSV sans rapport (ETAT_TRAVAILLEUR_*.csv)
  # et un sous-dossier fichiers_mensuels/ : le code doit filtrer par extension/pattern,
  # ne jamais lister ce prefixe sans filtre.
  raw_prefix: "cnps/fichiers_mensuels/"
  # Prefixe des parquets issus de l'ingestion (MM_YYYY.parquet) + registre de suivi
  processed_prefix: "cnps/processed_data/"
  # Prefixe des donnees nettoyees et des bases structurees
  cleaned_prefix: "cnps/cleaned_data/"
  # Prefixe des modeles sauvegardes (.pkl)
  models_prefix: "cnps/models/"
  # Prefixe des exports Excel finaux (indicateurs, rapports, audits)
  output_prefix: "cnps/output/"
  # Connexion chiffree (le serveur interne tourne en HTTP simple)
  secure: false

# --- Parallelisation ---
parallel:
  # Nombre de workers (-1 = tous les coeurs)
  n_jobs: -1
  # Backend joblib: "loky", "threading", "multiprocessing"
  backend: "loky"

# --- Logging ---
logging:
  # Niveau: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # Rotation des logs
  rotation: "10 MB"
  # Retention
  retention: "30 days"
